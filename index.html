<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raport Zilnic Vânzări</title>
    <style>
        body {
            background-color: #EEF2F6 !important;
            color: #1E293B !important;
            margin: 0 !important;
            padding: 16px !important;
            font-family: 'Segoe UI', Arial, sans-serif !important;
        }
        .card {
            background-color: #FFFFFF !important;
            width: 100% !important;
            max-width: 480px !important;
            margin: 20px auto !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 25px rgba(31, 78, 120, 0.15) !important;
            overflow: hidden !important;
            border: 1px solid #CBD5E1 !important;
        }
        .card-header {
            background: #1F4E78 !important;
            color: #FFFFFF !important;
            padding: 24px 20px !important;
            text-align: center !important;
        }
        .card-header h1 {
            font-size: 20px !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            margin: 0 0 8px 0 !important;
        }
        .card-header .subtitle {
            font-size: 13px !important;
            color: #E2E8F0 !important;
            margin-bottom: 12px !important;
        }
        .timestamp-badge {
            display: inline-block !important;
            background: rgba(255, 255, 255, 0.2) !important;
            padding: 6px 14px !important;
            border-radius: 20px !important;
            font-size: 12px !important;
            font-weight: bold !important;
            color: #FFFFFF !important;
        }
        .card-body {
            padding: 24px !important;
        }
        .form-group {
            margin-bottom: 16px !important;
        }
        label {
            display: block !important;
            font-weight: bold !important;
            margin-bottom: 6px !important;
            font-size: 12px !important;
            color: #1E293B !important;
            text-transform: uppercase !important;
        }
        input, select {
            width: 100% !important;
            padding: 12px !important;
            background-color: #F8FAFC !important;
            border: 1px solid #CBD5E1 !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            color: #1E293B !important;
        }
        .btn-whatsapp {
            background-color: #25D366 !important;
            color: #FFFFFF !important;
            border: none !important;
            width: 100% !important;
            padding: 15px !important;
            border-radius: 10px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            margin-top: 10px !important;
        }
        .btn-group {
            display: flex !important;
            gap: 10px !important;
            margin-top: 10px !important;
        }
        .btn-secondary {
            flex: 1 !important;
            background-color: #F1F5F9 !important;
            color: #1F4E78 !important;
            border: 1px solid #CBD5E1 !important;
            padding: 12px !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            text-align: center !important;
        }
        .toast {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background-color: #DCFCE7 !important;
            color: #166534 !important;
            border-radius: 8px;
            font-size: 14px !important;
            text-align: center !important;
            font-weight: bold !important;
        }
        .card-footer {
            background-color: #F8FAFC !important;
            border-top: 1px solid #E2E8F0 !important;
            padding: 14px !important;
            text-align: center !important;
            font-size: 12px !important;
            color: #64748B !important;
        }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <div class="card-header">
        <h1>Raport Zilnic Vânzări</h1>
        <div class="subtitle">Activitate Teren</div>
        <div class="timestamp-badge" id="currentDateTime">Se încarcă...</div>
    </div>

    <div class="card-body">
        <form id="salesForm" onsubmit="sendToWhatsApp(event)">
            <div class="form-group">
                <label for="agentName">Nume Agent</label>
                <input type="text" id="agentName" required placeholder="ex: Popescu Ion">
            </div>

            <div class="form-group">
                <label for="location">Locația / Instituția</label>
                <input type="text" id="location" required placeholder="ex: Primăria / Școala">
            </div>

            <div class="form-group">
                <label for="saleAmount">Suma Vânzare (Lei)</label>
                <input type="number" id="saleAmount" required min="0" step="0.01" placeholder="ex: 2500">
            </div>

            <div class="form-group">
                <label for="status">Status Vânzare</label>
                <select id="status">
                    <option value="Validat">✅ Validat</option>
                    <option value="Stand-by">⏳ Stand-by vânzare</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Observații</label>
                <input type="text" id="notes" placeholder="Opțional">
            </div>

            <button type="submit" class="btn-whatsapp">
                📲 Trimite pe WhatsApp
            </button>

            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="copyReport()">📋 Copiază Text</button>
                <button type="button" class="btn-secondary" onclick="resetForm()">🔄 Resetează</button>
            </div>

            <div id="toastMsg" class="toast">Raportul a fost copiat!</div>
        </form>
    </div>

    <div class="card-footer">
        Sistem Centralizat
    </div>
</div>

<script>
    function updateTimestamp() {
        const now = new Date();
        const pad = (n) => n.toString().padStart(2, '0');
        const d = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()}`;
        const t = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        const stamp = `${d} | ${t}`;
        const el = document.getElementById('currentDateTime');
        if (el) el.textContent = stamp;
        return stamp;
    }

    updateTimestamp();
    setInterval(updateTimestamp, 10000);

    function buildReportText() {
        const stamp = updateTimestamp();
        const name = document.getElementById('agentName').value.trim() || '-';
        const loc = document.getElementById('location').value.trim() || '-';
        const amount = document.getElementById('saleAmount').value || '0';
        const status = document.getElementById('status').value;
        const notes = document.getElementById('notes').value.trim() || '-';

        return `*RAPORT ZILNIC VÂNZĂRI*\n` +
               `_Emis: ${stamp}_\n` +
               `────────────────────\n` +
               `• *Agent:* ${name}\n` +
               `• *Locația:* ${loc}\n` +
               `• *Suma:* ${amount} Lei\n` +
               `• *Status:* ${status}\n` +
               `• *Obs:* ${notes}`;
    }

    function sendToWhatsApp(e) {
        e.preventDefault();
        const text = buildReportText();
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyReport() {
        const form = document.getElementById('salesForm');
        if (!form.reportValidity()) return;
        const text = buildReportText();
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toastMsg');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        });
    }

    function resetForm() {
        document.getElementById('salesForm').reset();
        updateTimestamp();
    }
</script>

</body>
</html>
